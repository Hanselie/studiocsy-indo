    <!-- JS : CINEMATIC CAROUSEL ENGINE (Multi-instance) -->
    <script>
        (function () {
            'use strict';

            /**
             * Initialize a single cinema carousel instance.
             * Each .cinema-carousel on the page gets its own independent state.
             */
            function initSingleCarousel(carousel) {
                return; // Disabled: Using CSS Grid layout statically to show all 4 cards side-by-side.

                function buildClones() {
                    track.querySelectorAll('[data-clone]').forEach(function (c) { c.remove(); });

                    for (var i = 0; i < clonesPerSide; i++) {
                        var cloneEnd = originalSlides[i].cloneNode(true);
                        cloneEnd.setAttribute('data-clone', 'true');
                        cloneEnd.removeAttribute('data-index');
                        track.appendChild(cloneEnd);

                        var cloneStart = originalSlides[slideCount - 1 - i].cloneNode(true);
                        cloneStart.setAttribute('data-clone', 'true');
                        cloneStart.removeAttribute('data-index');
                        track.insertBefore(cloneStart, track.firstChild);
                    }

                    allSlides = Array.from(track.querySelectorAll('.cinema-slide'));
                    totalSlides = allSlides.length;
                }

                buildClones();

                // --- State ---
                // Start with slide 2 (index clonesPerSide + 1) centered so slides 1,2,3 are fully visible and slide 4 peeks on the right
                var currentIndex = clonesPerSide + (slideCount >= 2 ? 1 : 0);
                var slideWidth = 0;
                var isDragging = false;
                var startX = 0;
                var startTranslate = 0;
                var currentTranslate = 0;
                var isTransitioning = false;
                var dragThreshold = 50;

                // --- Build dots ---
                function buildDots() {
                    if (!dotsContainer) return;
                    dotsContainer.innerHTML = '';
                    for (var i = 0; i < slideCount; i++) {
                        var dot = document.createElement('button');
                        var isInitialActive = (slideCount >= 2 ? i === 1 : i === 0);
                        dot.className = 'cinema-dot' + (isInitialActive ? ' is-active' : '');
                        dot.setAttribute('role', 'tab');
                        dot.setAttribute('aria-label', 'Video ' + (i + 1));
                        dot.setAttribute('data-dot', i);
                        dot.addEventListener('click', (function (idx) {
                            return function () { goToSlide(idx + clonesPerSide, true); };
                        })(i));
                        dotsContainer.appendChild(dot);
                    }
                }
                buildDots();

                // --- Measure ---
                function measure() {
                    if (allSlides.length === 0) return;
                    slideWidth = allSlides[0].getBoundingClientRect().width;
                }

                // --- Position ---
                function setPosition(translate, animate) {
                    if (animate) {
                        track.classList.remove('is-dragging');
                    }
                    track.style.transform = 'translate3d(' + translate + 'px, 0, 0)';
                    currentTranslate = translate;
                }

                function getTranslateForIndex(idx) {
                    var carouselWidth = carousel.getBoundingClientRect().width;
                    var offset = (carouselWidth - slideWidth) / 2;
                    return -(idx * slideWidth) + offset;
                }

                // --- Depth classes ---
                function updateDepthClasses(idx) {
                    allSlides.forEach(function (slide, i) {
                        slide.classList.remove('is-active', 'is-adjacent', 'is-outer');
                        var diff = Math.abs(i - idx);
                        if (diff === 0) {
                            slide.classList.add('is-active');
                        } else if (diff === 1) {
                            slide.classList.add('is-adjacent');
                        }
                    });
                }

                // --- Dots update ---
                function updateDots(realIndex) {
                    if (!dotsContainer) return;
                    var dots = dotsContainer.querySelectorAll('.cinema-dot');
                    dots.forEach(function (dot, i) {
                        dot.classList.toggle('is-active', i === realIndex);
                    });
                }

                // --- Progress ---
                function updateProgress(realIndex) {
                    if (!progressFill) return;
                    var pct = ((realIndex + 1) / slideCount) * 100;
                    progressFill.style.width = pct + '%';
                }

                // --- Go to slide ---
                function goToSlide(idx, animate) {
                    if (isTransitioning && animate) return;
                    currentIndex = idx;
                    measure();
                    var translate = getTranslateForIndex(idx);

                    if (animate) {
                        isTransitioning = true;
                    }

                    setPosition(translate, animate);
                    updateDepthClasses(idx);

                    var realIndex = ((idx - clonesPerSide) % slideCount + slideCount) % slideCount;
                    updateDots(realIndex);
                    updateProgress(realIndex);
                    updateLazyLoad(idx);
                }

                // --- Infinite loop snap ---
                track.addEventListener('transitionend', function () {
                    isTransitioning = false;

                    if (currentIndex < clonesPerSide) {
                        var jumpTo = currentIndex + slideCount;
                        track.style.transition = 'none';
                        currentIndex = jumpTo;
                        setPosition(getTranslateForIndex(jumpTo), false);
                        updateDepthClasses(jumpTo);
                        track.offsetHeight; // force reflow
                        track.style.transition = '';
                    } else if (currentIndex >= clonesPerSide + slideCount) {
                        var jumpTo = currentIndex - slideCount;
                        track.style.transition = 'none';
                        currentIndex = jumpTo;
                        setPosition(getTranslateForIndex(jumpTo), false);
                        updateDepthClasses(jumpTo);
                        track.offsetHeight;
                        track.style.transition = '';
                    }
                });

                // --- Navigation ---
                function goPrev() { goToSlide(currentIndex - 1, true); }
                function goNext() { goToSlide(currentIndex + 1, true); }

                if (prevBtn) prevBtn.addEventListener('click', function (e) { e.preventDefault(); goPrev(); });
                if (nextBtn) nextBtn.addEventListener('click', function (e) { e.preventDefault(); goNext(); });

                // --- Keyboard ---
                carousel.setAttribute('tabindex', '0');
                carousel.addEventListener('keydown', function (e) {
                    if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
                    if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
                });

                // --- Drag / Touch ---
                var isDown = false;
                var isDragging = false;
                var startX = 0;
                var startY = 0;
                var startTranslate = 0;
                var dragDirection = null;

                function getClientX(e) {
                    if (e.type.indexOf('touch') !== -1) {
                        return e.touches && e.touches.length ? e.touches[0].clientX : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0].clientX : 0);
                    }
                    return e.clientX;
                }

                function getClientY(e) {
                    if (e.type.indexOf('touch') !== -1) {
                        return e.touches && e.touches.length ? e.touches[0].clientY : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0].clientY : 0);
                    }
                    return e.clientY;
                }

                function onDragStart(e) {
                    if (e.target.closest('.cinema-nav') || e.target.closest('.cinema-dot')) return;
                    isDown = true;
                    isDragging = false;
                    dragDirection = null;
                    startX = getClientX(e);
                    startY = getClientY(e);
                    startTranslate = currentTranslate;
                }

                function onDragMove(e) {
                    if (!isDown) return;
                    var x = getClientX(e);
                    var y = getClientY(e);
                    var diffX = x - startX;
                    var diffY = y - startY;

                    if (!dragDirection) {
                        if (Math.abs(diffX) > 5 || Math.abs(diffY) > 5) {
                            if (Math.abs(diffX) > Math.abs(diffY)) {
                                dragDirection = 'horizontal';
                            } else {
                                dragDirection = 'vertical';
                                isDown = false; // vertical page scroll
                            }
                        }
                    }

                    if (dragDirection === 'horizontal') {
                        if (!isDragging && Math.abs(diffX) > 8) {
                            isDragging = true;
                            track.classList.add('is-dragging');
                        }
                        if (isDragging) {
                            if (e.cancelable) e.preventDefault();
                            setPosition(startTranslate + diffX, false);
                        }
                    }
                }

                function onDragEnd(e) {
                    if (!isDown) return;
                    isDown = false;

                    if (isDragging) {
                        isDragging = false;
                        track.classList.remove('is-dragging');

                        var x = getClientX(e);
                        var diff = x - startX;

                        if (Math.abs(diff) > dragThreshold) {
                            diff > 0 ? goPrev() : goNext();
                        } else {
                            goToSlide(currentIndex, true);
                        }
                    }
                }

                carousel.addEventListener('mousedown', onDragStart, { passive: false });
                carousel.addEventListener('mousemove', onDragMove, { passive: false });
                carousel.addEventListener('mouseup', onDragEnd);
                carousel.addEventListener('mouseleave', function (e) {
                    if (isDown) onDragEnd(e);
                });

                carousel.addEventListener('touchstart', onDragStart, { passive: true });
                carousel.addEventListener('touchmove', onDragMove, { passive: false });
                carousel.addEventListener('touchend', onDragEnd);

                // --- Horizontal wheel ---
                var wheelTimeout = null;
                carousel.addEventListener('wheel', function (e) {
                    var delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
                    if (Math.abs(delta) < 10) return;
                    e.preventDefault();
                    if (wheelTimeout) return;

                    delta > 0 ? goNext() : goPrev();
                    wheelTimeout = setTimeout(function () { wheelTimeout = null; }, 600);
                }, { passive: false });

                // --- Video click / tap control ---
                allSlides.forEach(function (slide) {
                    var video = slide.querySelector('video');
                    if (!video) return;

                    video.addEventListener('click', function (e) {
                        var rect = video.getBoundingClientRect();
                        var clickY = e.clientY - rect.top;

                        // bottom 20% contains native controls
                        if (clickY > rect.height * 0.8) {
                            return;
                        }

                        // Toggle play/pause & unmute on body click
                        if (video.muted) {
                            video.muted = false;
                            if (video.paused) {
                                video.play().catch(function () { });
                            }
                        } else {
                            if (video.paused) {
                                video.play().catch(function () { });
                            } else {
                                video.pause();
                            }
                        }
                    });
                });

                // --- Video autoplay for active slide ---
                function updateLazyLoad(idx) {
                    allSlides.forEach(function (slide, i) {
                        var video = slide.querySelector('video');
                        if (!video) return;
                        var diff = Math.abs(i - idx);
                        if (diff === 0) {
                            video.muted = true; // Autoplay is always muted
                            video.play().catch(function () { });
                        } else {
                            video.pause();
                            video.muted = true; // Reset offscreen videos to muted
                        }
                    });
                }

                // --- Resize ---
                var resizeTimer = null;
                window.addEventListener('resize', function () {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function () {
                        measure();
                        setPosition(getTranslateForIndex(currentIndex), false);
                        updateDepthClasses(currentIndex);
                    }, 150);
                });

                // --- Init ---
                measure();
                goToSlide(currentIndex, false);

                requestAnimationFrame(function () {
                    measure();
                    goToSlide(currentIndex, false);
                });
            }

            /**
             * Find and initialize ALL .cinema-carousel instances on the page.
             */
            function initAllCarousels() {
                var carousels = document.querySelectorAll('.cinema-carousel');
                carousels.forEach(function (c) {
                    initSingleCarousel(c);
                });
            }

            // Initialize after includes are loaded
            document.addEventListener('includesLoaded', function () {
                setTimeout(initAllCarousels, 80);
            });

            // Fallback
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function () {
                    setTimeout(initAllCarousels, 200);
                });
            } else {
                setTimeout(initAllCarousels, 200);
            }
        })();
    </script>
